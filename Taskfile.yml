version: "3"

vars:
  BIN: schemachecker
  BUILD_DIR: build
  GIT_SHA:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  VERSION:
    sh: |
      if [ -f version.txt ]; then cat version.txt
      elif V=$(git describe --tags --abbrev=0 2>/dev/null); then echo "${V#v}"
      else echo 0.1.0
      fi
  LDFLAGS: >-
    -X main.Version={{.VERSION}}
    -X main.GitSHA={{.GIT_SHA}}
  DIST: dist
  RELEASE_VERSION: '{{.VERSION}}'
  RELEASE_LDFLAGS: -s -w -X main.Version={{.RELEASE_VERSION}} -X main.GitSHA={{.GIT_SHA}}
  SIGN_IDENTITY: MyLocalCodeSign

tasks:
  modupdate:
    desc: Update Go module dependencies
    cmds:
      - go get -u ./...
      - go mod tidy -v

  ci:
    desc: Full CI pipeline (build, vet, test)
    cmds:
      - task: go:build
      - task: go:vet
      - task: go:test

  default:
    desc: Alias for ci
    cmds:
      - task: ci

  # ── Go ──────────────────────────────────────────────────────────────

  go:build:
    desc: Build Go CLI binary
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BIN}} .

  go:install:
    desc: Build and install binary to ~/bin
    cmds:
      - task: go:build
      - mkdir -p ~/bin
      - cp -af {{.BUILD_DIR}}/{{.BIN}} ~/bin/

  go:test:
    desc: Run Go tests with race detector
    cmds:
      - go test -race -count=1 -timeout 120s ./...

  go:test:cover:
    desc: Run Go tests with coverage report
    cmds:
      - go test -race -coverprofile=coverage.out -timeout 120s ./...
      - go tool cover -html=coverage.out -o coverage.html

  go:vet:
    desc: Run go vet static analysis
    cmds:
      - go vet ./...

  go:lint:
    desc: Lint Go code with golangci-lint
    cmds:
      - golangci-lint run ./...

  go:fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  go:tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  go:run:
    desc: Run Go CLI (pass CLI_ARGS="..." for arguments)
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" . {{.CLI_ARGS}}

  go:release:
    desc: Build native release binary for current platform
    cmds:
      - mkdir -p {{.DIST}}
      - go build -trimpath -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.DIST}}/{{.BIN}}-{{OS}}-{{ARCH}} .

  go:release:signed:
    desc: Build and codesign release binary for current platform (macOS only)
    platforms: [darwin]
    cmds:
      - task: go:release
      - task: sign

  go:clean:
    desc: Clean Go build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}} dist coverage.out coverage.html

  # ── Code Signing (macOS) ─────────────────────────────────────────────

  sign:cert:
    desc: Generate self-signed code-signing certificate and import into Keychain
    platforms: [darwin]
    cmds:
      - |
        set -euo pipefail
        cat > codesign.cnf <<'EOF'
        [ req ]
        default_bits       = 2048
        distinguished_name = req_distinguished_name
        x509_extensions    = v3_req
        prompt             = no

        [ req_distinguished_name ]
        CN = {{.SIGN_IDENTITY}}

        [ v3_req ]
        basicConstraints = CA:TRUE
        keyUsage = critical, digitalSignature
        extendedKeyUsage = critical, 1.3.6.1.5.5.7.3.3
        EOF
        openssl req -x509 -days 3650 -nodes -newkey rsa:2048 \
          -keyout codesign.key -out codesign.crt -config codesign.cnf
        openssl pkcs12 -export -legacy -in codesign.crt -inkey codesign.key \
          -out codesign.p12 -name "{{.SIGN_IDENTITY}}" -passout pass:12345
        security import codesign.p12 \
          -k ~/Library/Keychains/login.keychain-db -P "12345" -T /usr/bin/codesign
        security add-trusted-cert -d -r trustRoot \
          -k ~/Library/Keychains/login.keychain-db codesign.crt
        rm -f codesign.key codesign.crt codesign.p12 codesign.cnf
        echo "Certificate '{{.SIGN_IDENTITY}}' imported. Verify with: security find-identity -p codesigning -v"

  sign:
    desc: Wrap the release binary in a macOS .app bundle and codesign the bundle (SIGN_BIN=source binary, SIGN_APP=output bundle)
    platforms: [darwin]
    vars:
      SIGN_BIN: '{{.SIGN_BIN | default (printf "%s/%s-%s-%s" .DIST .BIN OS ARCH)}}'
      SIGN_APP: '{{.SIGN_APP | default (printf "%s/%s.app" .DIST .BIN)}}'
    cmds:
      - rm -rf "{{.SIGN_APP}}"
      - mkdir -p "{{.SIGN_APP}}/Contents/MacOS"
      - cp -af "{{.SIGN_BIN}}" "{{.SIGN_APP}}/Contents/MacOS/{{.BIN}}"
      - |
        cat > "{{.SIGN_APP}}/Contents/Info.plist" <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleIdentifier</key>
          <string>com.visdomtech.schemachecker</string>
          <key>CFBundleName</key>
          <string>{{.BIN}}</string>
          <key>CFBundleExecutable</key>
          <string>{{.BIN}}</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleShortVersionString</key>
          <string>{{.RELEASE_VERSION}}</string>
          <key>CFBundleVersion</key>
          <string>{{.RELEASE_VERSION}}</string>
        </dict>
        </plist>
        EOF
      - plutil -lint "{{.SIGN_APP}}/Contents/Info.plist"
      - codesign --force --sign "{{.SIGN_IDENTITY}}" "{{.SIGN_APP}}"
      - codesign --verify --deep --strict --verbose=2 "{{.SIGN_APP}}"
      - codesign -d -vvv "{{.SIGN_APP}}"
